name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up repository pnpm version
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Verify pinned tool versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const nodeVersion = readFileSync('.nvmrc', 'utf8').trim();
          const pnpmVersion = execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim();
          assert.equal(process.versions.node, nodeVersion);
          assert.equal(pkg.engines.node, nodeVersion);
          assert.equal(pkg.engines.pnpm, pnpmVersion);
          assert.equal(pkg.packageManager, `pnpm@${pnpmVersion}`);
          console.log(`Node.js ${nodeVersion}; pnpm ${pnpmVersion}`);
          NODE

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI assets
        run: pnpm ui:build

      - name: Check code
        run: pnpm check

      - name: Run all automated unit and regression tests
        run: pnpm test

      - name: Build Worker without deploying
        run: pnpm build
